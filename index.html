<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SPP Omah Bocil</title>
<meta name="theme-color" content="#173d7a">
<meta name="description" content="Aplikasi pencatatan SPP Bimbingan Belajar Omah Bocil">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SPP Bocil">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div id="boot" class="boot"><img src="assets/logo_omahbocil.png" alt="Logo Omah Bocil"><p>Memuat aplikasi…</p></div>
<div id="login" class="login hidden"></div>

<div id="appShell" class="hidden">
  <header class="topbar">
    <button type="button" class="menu-toggle" id="menuToggle" aria-label="Buka menu">☰</button>
    <img src="assets/logo_omahbocil.png" alt="Logo Omah Bocil" class="top-logo">
    <div class="top-title"><h1>Omah Bocil — SPP Manager</h1><p>Teman Belajar, Raih Prestasi!</p></div>
    <div class="top-right">
      <span id="status" class="chip on">Online</span>
      <span id="who" class="who"></span>
      <a href="#/ganti-password">Ganti Password</a> · <a href="#" id="logout" onclick="return false">Keluar</a>
    </div>
  </header>
  <div class="layout">
    <aside class="sidebar" id="sidebar">
      <nav id="nav"></nav>
      <button type="button" class="btn small block hidden" id="install">📲 Pasang di HP</button>
    </aside>
    <div class="backdrop" id="backdrop"></div>
    <main>
      <div id="fsError" class="flash error hidden"></div>
      <div id="main"></div>
    </main>
  </div>
</div>
<div id="printRoot" class="print-root"></div>
<div id="toasts" class="toasts" aria-live="polite"></div>
<noscript>Aplikasi ini membutuhkan JavaScript.</noscript>
<script type="module" src="js/main.js"></script>
</body>
</html>
